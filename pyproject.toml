[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
authors = [{name = "Wenxin Jiang"}]
maintainers = [{name = "Wenxin Jiang"}]
name = "prusie"
version = "0.2.4.dev2"
description = "Fast Rust implementation of SuSiE and SuSiE-RSS fine-mapping for Python"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<3"]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/**"]

[project.urls]
Repository = "https://github.com/LucaJiang/prusie"
Documentation = "https://lucajiang.github.io/prusie/"
Issues = "https://github.com/LucaJiang/prusie/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
analysis = ["scipy>=1.11", "matplotlib>=3.7"]

[tool.maturin]
manifest-path = "rust/prusie-python/Cargo.toml"
python-source = "src"
module-name = "prusie._native"
features = ["extension-module"]
# Runtime Python files/data and Cargo sources are included by maturin.
# The source distribution also includes the tests and their frozen references.
exclude = [
    "dist/**", "target/**", "**/*.orig", "**/*.rej", "**/__pycache__/**",
    ".pytest_cache/**", ".ruff_cache/**", "docs/**", ".github/**", "tools/**",
    "dev/**", "examples/**", "requirements-dev.lock",
]
include = [
    {path = "rust-toolchain.toml", format = "sdist"},
    {path = "rustfmt.toml", format = "sdist"},
    {path = "tests/**", format = "sdist"},
    {path = "CITATION.cff", format = "sdist"},
    {path = "CHANGELOG.md", format = "sdist"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Preserve upstream copies, frozen evidence, and generated documentation byte for byte.
extend-exclude = ["tools/vendor", "docs", "src/prusie/data", "tests/data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Standard statistical notation in docstrings and comments, not identifiers.
allowed-confusables = ["α", "γ", "σ", "ℓ", "×", "−"]

[tool.ruff.lint.per-file-ignores]
# Mathematical signs and Greek labels are intentional output, not identifiers.
"tests/reference_susier.py" = ["RUF001"]
"src/prusie/_style.py" = ["RUF001"]
"src/prusie/plots.py" = ["RUF001"]
# Preserve the mathematical minus sign in the convergence criterion documentation.
"src/prusie/diagnostics.py" = ["RUF002"]
# These tests exercise exactly those Unicode labels, including variant IDs.
"tests/test_plot_semantics.py" = ["RUF001"]
"tests/test_plots_report.py" = ["RUF001"]
# Published mathematical signs and typographic punctuation are frozen page content.
"tools/generate_results.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# Executable examples inside docstrings are not part of this formatting pass.
docstring-code-format = false
