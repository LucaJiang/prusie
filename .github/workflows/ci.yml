name: tests-and-packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PRUSIE_NUM_THREADS: '1'
  CARGO_BUILD_JOBS: '4'
  MPLBACKEND: Agg
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-dev.lock ruff==0.16.9
      - run: rustup show
      - run: ruff check
      - run: ruff format --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features vector-math -- -D warnings
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '1.26.4'
          - python: '3.12'
            numpy: '2.5.3'
          - python: '3.13'
            numpy: '2.5.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy==${{ matrix.numpy }}' '.[test,analysis]'
      - run: python -m pytest tests
      # The scalar-only Rust build exercises the scalar SER implementation.
      - if: matrix.python == '3.13'
        run: |
          cargo test --locked --lib --no-default-features -- --test-threads=1
          cargo test --locked --lib --no-default-features --features vector-math -- --test-threads=1
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-dev.lock maturin==1.10.2
      - run: maturin build --release --locked --out dist
      - run: maturin sdist --out dist
      - name: Install the wheel and fit with NumPy only
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import prusie; ex = prusie.load_example(); f = prusie.susie_rss(**ex['inputs'], **ex['parameters']); print(f.niter, f.pip.max())"
      - run: python -m pip wheel --no-deps dist/*.tar.gz -w sdist-wheel
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/generate_example.py --check
      - run: python tools/build_docs.py
      - name: Check rendered mathematics
        run: |
          grep -q 'class="katex"' docs/model.html
          ! grep -q '\$\$' docs/model.html
