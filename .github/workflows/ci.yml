name: tests-and-packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      r_reference:
        description: Check the frozen examples with pinned susieR
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PRUSIE_NUM_THREADS: '1'
  CARGO_BUILD_JOBS: '4'
  MPLBACKEND: Agg
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-dev.lock ruff==0.16.9
      - run: rustup show
      - run: ruff check
      - run: ruff format --check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
            numpy: '1.26.4'
            features: extension-module
          - os: ubuntu-24.04
            python: '3.12'
            numpy: '2.5.3'
            features: extension-module
          - os: ubuntu-24.04
            python: '3.13'
            numpy: '2.5.3'
            features: extension-module
          - os: macos-latest
            python: '3.12'
            numpy: '2.5.3'
            features: extension-module
          - os: windows-latest
            python: '3.12'
            numpy: '2.5.3'
            features: extension-module
          - os: ubuntu-24.04
            python: '3.12'
            numpy: '2.5.3'
            features: extension-module,portable-math
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy==${{ matrix.numpy }}' 'pytest>=8,<9' 'scipy>=1.11' 'matplotlib>=3.7' 'maturin==1.10.2'
      - run: maturin build --release --locked --features '${{ matrix.features }}' --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest tests
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' && matrix.features == 'extension-module'
        run: python -m pytest tools/benchmark/_internal
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        run: |
          cargo test --locked -p prusie-core -- --test-threads=1
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.5.3' 'pytest>=8,<9' 'scipy>=1.11' 'matplotlib>=3.7' 'maturin==1.10.2' 'coverage[toml]>=7.6'
      - run: maturin build --release --locked --out dist
      - run: python -m pip install dist/*.whl
      - name: Measure line coverage of the installed package
        run: |
          package=$(python -c 'import pathlib, prusie; print(pathlib.Path(prusie.__file__).parent)')
          python -m coverage run --source="$package" -m pytest tests -q
          python -m coverage report --precision=1 | tail -n 1
          python -m coverage json -o coverage.json
      - name: Write the badge endpoint
        run: |
          python - <<'PY'
          import json
          percent = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if percent >= 90 else "green" if percent >= 80 else "yellow" if percent >= 70 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{percent:.0f}%", "color": color}
          json.dump(badge, open("coverage-badge.json", "w"))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.json
      - name: Publish the badge on the badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          content=$(base64 -w0 coverage-badge.json)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/coverage.json?ref=badges" --jq .sha 2>/dev/null || true)
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/badges" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/badges -f sha="$GITHUB_SHA"
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/coverage.json" \
            -f message="Update coverage badge for $GITHUB_SHA" -f branch=badges \
            -f content="$content" ${sha:+-f sha="$sha"}
  r-reference:
    if: github.event_name == 'workflow_dispatch' && inputs.r_reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install the pinned reference
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages(c("remotes", "jsonlite")); remotes::install_github("stephenslab/susieR@8e56a8e038e989856d106d9ca5175cc664fea9d2", upgrade="never")'
      - name: Check frozen inputs and complete alpha matrices
        run: Rscript --vanilla tools/check_r_reference.R
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-dev.lock maturin==1.10.2
      - run: maturin build --release --locked --out dist
      - run: maturin sdist --out dist
      - name: Install the wheel and fit with NumPy only
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import prusie; ex = prusie.load_example(); f = prusie.susie_rss(**ex['inputs'], **ex['parameters']); print(f.niter, f.pip.max())"
      - run: python -m pip wheel --no-deps dist/*.tar.gz -w sdist-wheel
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/generate_example.py --check
      - run: python tools/build_docs.py
      - name: Check rendered mathematics
        run: |
          grep -q 'class="katex"' docs/model.html
          ! grep -q '\$\$' docs/model.html
