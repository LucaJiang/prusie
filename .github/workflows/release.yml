name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build and publish; leave empty for build only'
        required: false
        type: string
  repository_dispatch:
    types: [release-existing-tag]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PRUSIE_NUM_THREADS: '1'
jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out dist -i python3.10
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*-cp310-abi3-*.whl
          if-no-files-found: error
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*-cp310-abi3-*.whl
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: x64
          args: --release --locked --out dist -i python
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-x64
          path: dist/*-cp310-abi3-*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
  smoke:
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        python: ['3.10', '3.15']
        include:
          - os: ubuntu-24.04
            artifact: wheels-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - os: macos-15-intel
            artifact: wheels-macos-x86_64
          - os: macos-latest
            artifact: wheels-macos-aarch64
          - os: windows-latest
            artifact: wheels-windows-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the wheel without a source build and run the tests
        run: |
          python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<9' 'scipy>=1.11' 'matplotlib>=3.7'
          python -m pip install --only-binary=:all: --no-index --find-links dist prusie
          python -m pytest tests -q
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v') || startsWith(github.event.client_payload.release_tag, 'v')
    needs: [smoke, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.release_tag || github.event.client_payload.release_tag) && format('refs/tags/{0}', inputs.release_tag || github.event.client_payload.release_tag) || github.ref }}
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || github.ref_name }}
        run: |
          prerelease=""
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "prusie ${RELEASE_TAG#v}" --notes-from-tag --verify-tag $prerelease
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
  pypi:
    needs: publish
    if: github.ref == 'refs/tags/v0.3.1' || inputs.release_tag == 'v0.3.1' || github.event.client_payload.release_tag == 'v0.3.1'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/prusie
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Collect exactly the six release packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('artifacts')
          wheels = list(root.rglob('*.whl'))
          sdists = list(root.rglob('*.tar.gz'))
          assert len(wheels) == 5, [str(p) for p in wheels]
          assert len(sdists) == 1, [str(p) for p in sdists]
          assert all(p.name.startswith('prusie-0.3.1-cp310-abi3-') for p in wheels)
          assert sdists[0].name == 'prusie-0.3.1.tar.gz'
          names = {p.name for p in wheels + sdists}
          assert len(names) == 6, names
          dist = Path('dist')
          dist.mkdir()
          for package in wheels + sdists:
              shutil.copyfile(package, dist / package.name)
          assert {p.name for p in dist.iterdir()} == names
          PY
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
