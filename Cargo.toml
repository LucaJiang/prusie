[workspace]
members = ["rust/prusie-core", "rust/prusie-python"]
default-members = ["rust/prusie-core", "rust/prusie-python"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
ndarray = "=0.16.1"

[profile.release]
codegen-units = 1
